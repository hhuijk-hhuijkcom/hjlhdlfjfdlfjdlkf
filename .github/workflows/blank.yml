name: Steam Lua Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # 允许在 Actions 页面手动点按钮触发

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装依赖（如果脚本用了 npm 包）
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      # 4. 运行你的检测脚本
      - name: Run check-github-lua.js
        run: node check-github-lua.js
